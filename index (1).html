<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ tiền cá nhân</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#12242b;--mute:#5d7078;--line:#d6e0e3;--pri:#0f766e;--bad:#c2410c;--an:#2563eb;--xang:#d97706;--tudo:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a1f;--card:#16262d;--ink:#e6f0f2;--mute:#8fa5ad;--line:#27404a;--pri:#2dd4bf;--bad:#fb923c;--an:#60a5fa;--xang:#fbbf24;--tudo:#2dd4bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1,h2{margin:0}h2{font-size:16px;margin-bottom:10px}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.big{font-size:clamp(34px,8vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1}
.mute{color:var(--mute);font-size:13px}
.ok{color:var(--pri);font-weight:600}.neg{color:var(--bad)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card b{display:block;font-size:22px;font-weight:700}
.fund{border-left:5px solid var(--c)}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
input,select,button{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button{cursor:pointer;background:var(--pri);color:var(--bg);border:0;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:18px}
.cv{position:relative;height:240px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n{text-align:right}th.n{text-align:right}
td button{padding:3px 8px;background:transparent;color:var(--bad);border:1px solid var(--line)}
.warn{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<main>
<div class="hero">
  <div><div class="mute">Tiền mặt đang có</div><div class="big" id="cash">0đ</div></div>
  <div style="text-align:right"><div id="check" class="ok"></div><div class="mute" id="asof"></div></div>
</div>
<div class="card" style="margin-bottom:18px">
  <div id="cstat" class="mute"></div>
  <form id="authform" style="margin-top:8px" onsubmit="return false">
    <label>Email<input id="em" type="email" autocomplete="username"></label>
    <label>Mật khẩu (từ 6 ký tự)<input id="pw" type="password" autocomplete="current-password"></label>
    <button type="button" id="login">Đăng nhập</button>
    <button type="button" id="signup" class="ghost">Tạo tài khoản</button>
  </form>
  <button class="ghost" id="logout" style="display:none;margin-top:8px">Đăng xuất</button>
</div>
<div class="warn" id="warn"></div>

<div class="grid" id="funds"></div>
<div class="grid">
  <div class="card"><span class="mute">Tiết kiệm</span><b id="sav"></b></div>
  <div class="card"><span class="mute">Nợ ăn trưa công ty (chưa trả)</span><b id="debt"></b></div>
  <div class="card"><span class="mute">Chi tháng này</span><b id="mout"></b></div>
  <div class="card"><span class="mute">Thu tháng này</span><b id="min"></b></div>
</div>

<div class="card" style="margin-bottom:18px">
<h2>Thêm giao dịch</h2>
<form id="f">
  <label>Ngày<input type="date" id="date" required></label>
  <label>Loại<select id="type">
    <option value="chi">Chi tiêu</option>
    <option value="thu">Thu nhập</option>
    <option value="chuyen">Chuyển giữa quỹ</option>
    <option value="no">Ghi nợ ăn trưa (chưa trả)</option>
    <option value="tranno">Trả nợ ăn trưa</option>
    <option value="tk">Chuyển tiết kiệm</option>
  </select></label>
  <label id="lf">Trừ từ quỹ<select id="from"></select></label>
  <label id="lt">Cộng vào quỹ<select id="to"></select></label>
  <label>Số tiền (vd 20k, 35000)<input id="amt" required autocomplete="off"></label>
  <label>Nội dung<input id="note" placeholder="Ăn sáng, xăng..."></label>
  <button>Ghi sổ</button>
</form>
</div>
<div class="row">
  <button class="ghost" id="sync">Đồng bộ tiền mặt thực tế</button>
  <button class="ghost" id="exp">Xuất file sao lưu</button>
  <button class="ghost" id="imp">Nhập file sao lưu</button>
  <button class="ghost" id="rst">Đặt lại số đầu kỳ</button>
  <input type="file" id="file" accept=".json" hidden>
</div>

<div class="charts">
  <div class="card"><h2>Chi theo quỹ</h2><div class="cv"><canvas id="c1"></canvas></div></div>
  <div class="card"><h2>Chi mỗi ngày (14 ngày gần nhất)</h2><div class="cv"><canvas id="c2"></canvas></div></div>
  <div class="card"><h2>Tiền mặt theo thời gian</h2><div class="cv"><canvas id="c3"></canvas></div></div>
  <div class="card"><h2>Số dư từng quỹ</h2><div class="cv"><canvas id="c4"></canvas></div></div>
</div>

<div class="card"><h2>Lịch sử giao dịch</h2>
<div class="tw"><table><thead><tr><th>Ngày</th><th>Nội dung</th><th>Loại</th><th>Quỹ</th><th class="n">Số tiền</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</main>

<script>
const KEY='so-tien-v1';
const FN={an:'Quỹ ăn',xang:'Quỹ xăng',tudo:'Quỹ tự do'};
const TL={chi:'Chi',thu:'Thu nhập',chuyen:'Chuyển quỹ',no:'Ghi nợ ăn trưa',tranno:'Trả nợ ăn trưa',tk:'Chuyển tiết kiệm',dc:'Điều chỉnh (chênh lệch chưa xác định nguồn)'};
const DEF={open:{date:'2026-10-18',an:568000,xang:100000,tudo:200000,sav:1000000,debt:400000},txs:[]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
const $=i=>document.getElementById(i);
const fmt=n=>(n<0?'-':'')+Math.abs(n).toLocaleString('vi-VN')+'đ';
const parse=s=>{const m=String(s).trim().toLowerCase().replace(/[.,\s]/g,'').match(/^(-?\d+)(k|tr)?$/);return m?+m[1]*(m[2]=='k'?1e3:m[2]=='tr'?1e6:1):NaN};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const vd=d=>d.split('-').reverse().join('/');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudPush()};

/* ===== ĐỒNG BỘ FIREBASE: dán cấu hình của bạn vào đây ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyBxYcZ91BKifVsZu_wiWh5kul4Do3N5QvM",authDomain:"sotienaki.firebaseapp.com",projectId:"sotienaki",appId:"1:1090136053019:web:392fc66abd4ebc3ec22fbe"};
let auth=null,db=null,uid=null,unsub=null,lastJson='';
const setStat=m=>{$('cstat').textContent=m};
const nowT=()=>new Date().toLocaleTimeString('vi-VN');
function cloudInit(){
  if(!FIREBASE_CONFIG.apiKey||typeof firebase==='undefined'){setStat('Chưa bật đồng bộ: dữ liệu chỉ lưu trên máy này.');$('authform').style.display='none';return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(!u){uid=null;lastJson='';$('authform').style.display='';$('logout').style.display='none';setStat('Chưa đăng nhập. Đăng nhập để đồng bộ giữa các máy.');return}
    uid=u.uid;$('authform').style.display='none';$('logout').style.display='';setStat('Đang kết nối: '+u.email);
    unsub=db.collection('ledgers').doc(uid).onSnapshot(snap=>{
      if(!snap.exists){cloudPush();return}
      if(snap.metadata.hasPendingWrites)return;
      const j=snap.data().data;if(j===lastJson){setStat('Đã đồng bộ ('+u.email+') lúc '+nowT());return}
      try{S=JSON.parse(j);lastJson=j;try{localStorage.setItem(KEY,j)}catch(e){}render();setStat('Đã đồng bộ ('+u.email+') lúc '+nowT())}catch(e){setStat('Dữ liệu trên đám mây bị lỗi định dạng.')}
    },err=>setStat('Lỗi đồng bộ: '+err.message));
  });
  $('login').onclick=()=>auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(e=>alert('Đăng nhập chưa được: '+e.message));
  $('signup').onclick=()=>auth.createUserWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(e=>alert('Tạo tài khoản chưa được: '+e.message));
  $('logout').onclick=()=>auth.signOut();
}
function cloudPush(){
  if(!uid)return;const j=JSON.stringify(S);if(j===lastJson)return;lastJson=j;
  db.collection('ledgers').doc(uid).set({data:j,updated:Date.now()}).then(()=>setStat('Đã lưu lên đám mây lúc '+nowT())).catch(e=>setStat('Lỗi lưu: '+e.message));
}

function calc(){
  const o=S.open,f={an:o.an,xang:o.xang,tudo:o.tudo};let sav=o.sav,debt=o.debt;
  let cash=f.an+f.xang+f.tudo,cashChk=cash;
  const byFund={an:0,xang:0,tudo:0},daily={},line=[[o.date,cash]];
  const mk=today().slice(0,7);let mout=0,min=0;
  const list=[...S.txs].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  for(const t of list){
    const a=t.amt;
    if(t.type=='chi'){f[t.from]-=a;cashChk-=a;byFund[t.from]+=a;daily[t.date]=(daily[t.date]||0)+a;if(t.date.startsWith(mk))mout+=a}
    else if(t.type=='thu'){f[t.to]+=a;cashChk+=a;if(t.date.startsWith(mk))min+=a}
    else if(t.type=='chuyen'){f[t.from]-=a;f[t.to]+=a}
    else if(t.type=='no'){debt+=a}
    else if(t.type=='tranno'){debt-=a;f[t.from]-=a;cashChk-=a;byFund[t.from]+=a;daily[t.date]=(daily[t.date]||0)+a;if(t.date.startsWith(mk))mout+=a}
    else if(t.type=='tk'){f[t.from]-=a;sav+=a;cashChk-=a}
    else if(t.type=='dc'){f[t.to]+=a;cashChk+=a}
    cash=f.an+f.xang+f.tudo;line.push([t.date,cash]);
  }
  return{f,sav,debt,cash,cashChk,byFund,daily,line,mout,min,list};
}

let ch={};
function chart(id,cfg){
  const ink=getComputedStyle(document.body).getPropertyValue('--ink'),ln=getComputedStyle(document.body).getPropertyValue('--line');
  Chart.defaults.color=ink;Chart.defaults.font.family='"Be Vietnam Pro",system-ui';
  if(ch[id])ch[id].destroy();
  cfg.options={responsive:true,maintainAspectRatio:false,...cfg.options};
  if(cfg.type!='doughnut')cfg.options.scales={x:{grid:{color:ln}},y:{grid:{color:ln},ticks:{callback:v=>v/1000+'k'}}};
  ch[id]=new Chart($(id),cfg);
}

function render(){
  const R=calc(),css=n=>getComputedStyle(document.body).getPropertyValue('--'+n).trim();
  $('cash').textContent=fmt(R.cash);
  const diff=R.cash-R.cashChk;
  $('check').textContent=diff==0?'✓ Sổ khớp: tiền mặt = tổng các quỹ':'Lệch '+fmt(diff);
  $('asof').textContent='Số đầu kỳ ngày '+vd(S.open.date);
  $('funds').innerHTML=Object.keys(FN).map(k=>`<div class="card fund" style="--c:var(--${k})"><span class="mute">${FN[k]}</span><b class="${R.f[k]<0?'neg':''}">${fmt(R.f[k])}</b></div>`).join('');
  $('sav').textContent=fmt(R.sav);$('debt').textContent=fmt(R.debt);
  $('mout').textContent=fmt(R.mout);$('min').textContent=fmt(R.min);
  const neg=Object.keys(FN).filter(k=>R.f[k]<0);
  $('warn').style.display=neg.length?'block':'none';
  $('warn').textContent=neg.length?'Đang âm: '+neg.map(k=>FN[k]+' '+fmt(R.f[k])).join(', ')+'. Hãy chuyển quỹ hoặc ghi thêm thu nhập.':'';
  $('tb').innerHTML=[...R.list].reverse().map(t=>`<tr><td>${vd(t.date)}</td><td>${t.note||'—'}</td><td>${TL[t.type]}</td><td>${t.type=='chuyen'?FN[t.from]+' → '+FN[t.to]:FN[t.from||t.to]||'—'}</td><td class="n ${t.type=='thu'||t.type=='dc'&&t.amt>0?'ok':''}">${fmt(t.amt)}</td><td><button data-id="${t.id}" aria-label="Xóa">Xóa</button></td></tr>`).join('')||'<tr><td colspan="6" class="mute">Chưa có giao dịch. Nhập khoản đầu tiên ở phía trên.</td></tr>';
  chart('c1',{type:'doughnut',data:{labels:Object.values(FN),datasets:[{data:Object.keys(FN).map(k=>R.byFund[k]),backgroundColor:Object.keys(FN).map(k=>css(k)),borderWidth:0}]}});
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}
  chart('c2',{type:'bar',data:{labels:days.map(d=>vd(d).slice(0,5)),datasets:[{label:'Chi',data:days.map(d=>R.daily[d]||0),backgroundColor:css('pri')}]},options:{plugins:{legend:{display:false}}}});
  const byDay={};R.line.forEach(([d,v])=>byDay[d]=v);const ds=Object.keys(byDay).sort();
  chart('c3',{type:'line',data:{labels:ds.map(d=>vd(d).slice(0,5)),datasets:[{label:'Tiền mặt',data:ds.map(d=>byDay[d]),borderColor:css('pri'),backgroundColor:css('pri'),tension:.25}]},options:{plugins:{legend:{display:false}}}});
  chart('c4',{type:'bar',data:{labels:Object.values(FN),datasets:[{data:Object.keys(FN).map(k=>R.f[k]),backgroundColor:Object.keys(FN).map(k=>css(k))}]},options:{plugins:{legend:{display:false}}}});
}

function opts(){const h=Object.keys(FN).map(k=>`<option value="${k}">${FN[k]}</option>`).join('');$('from').innerHTML=h;$('to').innerHTML=h;$('from').value='an';$('to').value='tudo'}
function vis(){const t=$('type').value;$('lf').style.display=['chi','chuyen','tranno','tk'].includes(t)?'':'none';$('lt').style.display=['thu','chuyen'].includes(t)?'':'none'}
$('type').onchange=vis;
$('f').onsubmit=e=>{
  e.preventDefault();const a=parse($('amt').value);
  if(!(a>0))return alert('Số tiền chưa hợp lệ. Nhập ví dụ 20k hoặc 35000.');
  const t=$('type').value;
  if(t=='chuyen'&&$('from').value==$('to').value)return alert('Quỹ nguồn và quỹ đích đang giống nhau.');
  S.txs.push({id:Date.now(),date:$('date').value,type:t,amt:a,from:$('from').value,to:$('to').value,note:$('note').value.trim()});
  save();$('amt').value='';$('note').value='';render();$('amt').focus();
};
$('tb').onclick=e=>{const id=e.target.dataset.id;if(id&&confirm('Xóa giao dịch này?')){S.txs=S.txs.filter(t=>t.id!=id);save();render()}};
$('sync').onclick=()=>{
  const v=prompt('Số tiền mặt thực tế bạn đang có (vd 868k):');if(v===null)return;
  const a=parse(v);if(isNaN(a))return alert('Số tiền chưa hợp lệ.');
  const d=a-calc().cash;if(!d)return alert('Sổ đã khớp, không cần điều chỉnh.');
  S.txs.push({id:Date.now(),date:today(),type:'dc',amt:d,to:'tudo',note:'Chênh lệch chưa xác định nguồn'});save();render();
};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='so-tien-'+today()+'.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.open||!j.txs)throw 0;S=j;save();render()}catch(x){alert('File sao lưu không đúng định dạng.')}};r.readAsText(e.target.files[0])};
$('rst').onclick=()=>{
  if(!confirm('Đặt số đầu kỳ mới sẽ xóa toàn bộ lịch sử giao dịch hiện tại. Tiếp tục?'))return;
  const g=(m,d)=>{const v=prompt(m,d);return v===null?null:parse(v)};
  const an=g('Quỹ ăn',0),xang=g('Quỹ xăng',0),tudo=g('Quỹ tự do',0),sav=g('Tiết kiệm',0),debt=g('Nợ ăn trưa',0);
  if([an,xang,tudo,sav,debt].some(x=>x===null||isNaN(x)))return alert('Đã hủy vì có số chưa hợp lệ.');
  S={open:{date:today(),an,xang,tudo,sav,debt},txs:[]};save();render();
};
$('date').value=today();opts();vis();render();cloudInit();
</script>
</body>
</html>
